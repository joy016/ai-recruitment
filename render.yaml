services:
  - name: ai-recruitment-backend
    type: web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: backend/ai-recruitment/Dockerfile
    dockerContext: backend/ai-recruitment
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
