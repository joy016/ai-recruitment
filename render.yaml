services:
  - name: ai-recruitment-backend
    type: web
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend/ai-recruitment
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
